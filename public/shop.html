<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐭 鼠鼠商店</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/home" class="navbar-brand">
      <span>🐭</span>
      <span>鼠鼠发展改革委员会</span>
    </a>
    <div class="navbar-user">
      <span class="username" id="navUsername"></span>
      <span class="balance">💰 <span id="navBalance">0</span> 鼠鼠币</span>
      <button class="logout-btn" onclick="logout()">退出</button>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <h2>🛒 鼠鼠商店</h2>
        <div style="margin-left: auto;">
          <a href="/home" class="btn btn-secondary btn-sm">← 返回主页</a>
        </div>
      </div>

      <div id="message"></div>

      <!-- 商品类型筛选 -->
      <div class="tabs">
        <button class="tab active" onclick="filterProducts('all', this)">全部</button>
        <button class="tab" onclick="filterProducts('virtual_rights', this)">🎫 虚拟权益</button>
        <button class="tab" onclick="filterProducts('physical_gift', this)">🎁 实体礼物</button>
        <button class="tab" onclick="filterProducts('privilege', this)">⭐ 特权</button>
      </div>

      <div class="products-grid" id="productsGrid">
        <div class="empty-state">
          <div class="loading"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 购买确认模态框 -->
  <div class="modal" id="purchaseModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>确认购买</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="purchaseModalContent"></div>
    </div>
  </div>

  <script src="/js/animations.js"></script>
  <script src="/js/transition.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
