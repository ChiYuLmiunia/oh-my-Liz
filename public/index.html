<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐭 鼠鼠发展改革委员会 - 登录</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="mouse-emoji">🐭</div>
      <h1>鼠鼠币银行</h1>
      <p class="subtitle">欢迎来到鼠鼠发展改革委员会</p>
      
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">登录</button>
        <button class="auth-tab" onclick="switchTab('register')">注册</button>
      </div>

      <div id="message"></div>

      <!-- 登录表单 -->
      <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="loginUsername" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">🐭 登录</button>
      </form>

      <!-- 注册表单 -->
      <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="regUsername" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="regPassword" placeholder="请输入密码（至少6位）" required minlength="6">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" id="regPasswordConfirm" placeholder="请再次输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">✨ 注册账号</button>
      </form>
    </div>
  </div>

  <script src="/js/animations.js"></script>
  <script src="/js/transition.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
